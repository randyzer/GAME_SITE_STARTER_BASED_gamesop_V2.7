name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check types and tests
        run: npm run check

      - name: Assert unadopted final rejection
        run: npm run verify:unadopted-final

      - name: Validate, check and build neutral adoption
        run: npm run verify:adopted-final

      - name: Install browser engines
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Verify Core browser evidence
        run: npm run check:browser
        env:
          CORE_BROWSER_CONTRACT_MODE: PINNED_REFERENCE
