<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Fictional relay sequence</title>
  <desc id="desc">Supply Dock, Signal Bridge, then East Beacon. Each station consumes one Relay Cell; three lit stations complete the QA task.</desc>
  <rect width="960" height="540" fill="#f6f0df"/>
  <g font-family="sans-serif" fill="#203b3f" text-anchor="middle">
    <text x="480" y="70" font-size="31">Follow the circuit in order</text>
    <text x="480" y="110" font-size="20">Amber Lantern + 3 Relay Cells · QA relay rules v1</text>
    <g fill="#e9c679" stroke="#203b3f" stroke-width="3">
      <rect x="60" y="190" width="230" height="165" rx="12"/><rect x="365" y="190" width="230" height="165" rx="12"/><rect x="670" y="190" width="230" height="165" rx="12"/>
    </g>
    <g fill="none" stroke="#203b3f" stroke-width="5">
      <path d="M300 272h50m-15-12 15 12-15 12"/><path d="M605 272h50m-15-12 15 12-15 12"/>
    </g>
    <text x="175" y="235" font-size="24">1 · Supply Dock</text><text x="480" y="235" font-size="24">2 · Signal Bridge</text><text x="785" y="235" font-size="24">3 · East Beacon</text>
    <text x="175" y="300" font-size="21">consume 1 cell</text><text x="480" y="300" font-size="21">consume 1 cell</text><text x="785" y="300" font-size="21">consume 1 cell</text>
    <text x="480" y="410" font-size="25">Complete when all three stations are lit</text>
    <text x="480" y="455" font-size="19">If unlit: return with one cell; do not skip ahead.</text>
    <text x="480" y="500" font-size="17">Original synthetic QA diagram — not gameplay imagery</text>
  </g>
</svg>
